name: Scheduled Project Quality Checks

on:
  schedule:
    - cron: '31 9 * * 1'
      timezone: 'Asia/Kolkata'
    - cron: '34 10 * * 2'
      timezone: 'Asia/Kolkata'
    - cron: '2 9 * * 3'
      timezone: 'Asia/Kolkata'
    - cron: '3 11 * * 4'
      timezone: 'Asia/Kolkata'
    - cron: '6 10 * * 5'
      timezone: 'Asia/Kolkata'
    - cron: '34 9 * * 6'
      timezone: 'Asia/Kolkata'
    - cron: '5 11 * * 0'
      timezone: 'Asia/Kolkata'

  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          excluded = {
              ".git", ".venv", "venv",
              "node_modules", "__pycache__",
              "logs", "build", "dist"
          }

          files = [
              p for p in Path(".").rglob("*.py")
              if not any(part in excluded for part in p.parts)
          ]

          for file in files:
              py_compile.compile(str(file), doraise=True)

          print(f"Validated {len(files)} Python files.")
          PY

      - name: Run Python tests when available
        shell: bash
        run: |
          if find . -type f \
            \( -name "test_*.py" -o -name "*_test.py" \) \
            -not -path "*/venv/*" \
            -not -path "*/node_modules/*" \
            | grep -q .; then

            if [ -s requirements.txt ]; then
              python -m pip install -r requirements.txt
            fi

            python -m pip install pytest
            python -m pytest -q
          else
            echo "No Python test suite found. Skipping."
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and lint Node projects
        shell: bash
        run: |
          mapfile -t lockfiles < <(
            find . -name package-lock.json \
            -not -path "*/node_modules/*" \
            -not -path "*/.git/*"
          )

          for lockfile in "${lockfiles[@]}"; do
            directory=$(dirname "$lockfile")

            if [ -f "$directory/package.json" ]; then
              echo "Checking Node project: $directory"

              (
                cd "$directory"
                npm ci
                npm run lint --if-present
                npm run build --if-present
              )
            fi
          done

      - name: Record scheduled run
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            COUNT=1
          else
            # Random delay (0 to 15 minutes) so commits don't land on predictable minutes
            sleep $((RANDOM % 900))

            # Pick a random commit count per repo run:
            # ~35% chance of 0 commits, ~30% chance of 1, ~20% chance of 2, ~15% chance of 3
            ROLL=$((RANDOM % 20))
            if [ "$ROLL" -lt 7 ]; then
              COUNT=0
            elif [ "$ROLL" -lt 13 ]; then
              COUNT=1
            elif [ "$ROLL" -lt 17 ]; then
              COUNT=2
            else
              COUNT=3
            fi
          fi

          if [ "$COUNT" -eq 0 ]; then
            echo "No heartbeat commit needed for this run."
            exit 0
          fi

          git config user.name "asmit2704"
          git config user.email "asmit2704@users.noreply.github.com"

          for i in $(seq 1 $COUNT); do
            date -u +"Check #$i: %Y-%m-%d %H:%M:%S UTC" > .ci-heartbeat
            git add .ci-heartbeat
            git commit -m "chore(ci): scheduled quality check pass #$i"
            if [ "$i" -lt "$COUNT" ]; then
              sleep $((15 + RANDOM % 120))
            fi
          done

          git push

      - name: Complete quality checks
        run: echo "Scheduled quality checks completed."